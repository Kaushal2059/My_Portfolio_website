{% extends "layout.html" %}

{% block title %} Projects page {% endblock %}

{% block content %}
<h1 class="text-center">View my projects here!</h1>

<div class="d-flex flex-wrap gap-3 justify-content-center"> 

  {% for project in projects %}  
  <div class="card" style="width: 18rem;">
    <img src="{{ project.images.first.image.url }}" class="card-img-top" alt="{{ project.title }}">
    <div class="card-body">
      <h5 class="card-title">{{ project.title }}</h5>
      <p class="card-text">{{ project.content }}</p>  
      <a href="#" class="btn btn-primary">View more</a>
      
      {% if project.user == user %}
      <a href="{% url 'edit_project' project.id %}" class="btn btn-primary">Edit</a>
      <a href="{% url 'delete_project' project.id %}" class="btn btn-danger">Delete</a>
      {% endif %}
    </div>
  </div>
  {% endfor %}  

  <div class="mt-auto p-3 justify-content-center " style="width: 18rem;">
    <a href="{% url 'add_project' %}" class="btn btn-outline-success">
    Add a Project
</a>

</div>

{% endblock %}
