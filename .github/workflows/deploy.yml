name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - aws-deployment

jobs:

  test:
    name: Run Django Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        env:
          SECRET_KEY: "test-secret-key-for-ci-not-real"
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          TEST_DB: "sqlite"
          DB_PASSWORD: "testpassword"
          EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
          EMAIL_HOST: "smtp.gmail.com"
          EMAIL_PORT: "587"
          EMAIL: "test@test.com"
          EMAIL_PASSWORD: "testpassword"
          LINKEDIN_URL: "https://linkedin.com"
          FACEBOOK_URL: "https://facebook.com"
          INSTAGRAM_URL: "https://instagram.com"
          GITHUB_URL: "https://github.com"
        run: |
          python manage.py test --verbosity=2

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dev'

    steps: 
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with: 
          context: portfolio
          push: true   
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio:dev-latest
            ${{ secrets.DOCKER_USERNAME }}/portfolio:dev-${{ github.sha }}
        
      - name: Notify staging ready
        run: |
          echo "Staging image pushed sucessfully"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/portfolio:dev-latest"
          echo "Commit: ${{ github.sha }}"
          echo "Staging VM will pull this image within 5 minutes via cron"

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps: 
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with: 
          context: portfolio
          push: true   
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio:latest
            ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ github.sha }}
      
      - name: Notify production ready
        run: |
          echo "Production image pushed sucessfully"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/portfolio:latest"
          echo "Commit: ${{ github.sha }}"
          echo "Prodution VM will pull this image within 5 minutes via cron"

  deploy-aws:
    name: Deploy to AWS (ECR + EC2 via SSM)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/aws-deployment'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
 
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        uses: docker/build-push-action@v5
        with:  
          context: portfolio
          push: True
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy portfolio-web ${{ github.sha }}" \
            --parameters 'commands=["cd /home/ubuntu","docker compose -f docker-compose.prod.yml pull web","docker compose -f docker-compose.prod.yml up -d --force-recreate web"]' \
            --query "Command.CommandId" --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query "Status" --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query "StandardErrorContent" --output text
            echo "SSM deploy command finished with status: $STATUS"
            exit 1
          fi

          echo "Deploy succeeded — status: $STATUS"
